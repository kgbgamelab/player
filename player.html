<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KGB Audio Player</title>
  <style>
    :root{
      --ap-bg: rgba(0,0,0,0);
      --ap-grad-a: rgba(120,90,255,0.75);
      --ap-grad-b: rgba(200,60,255,0.55);
      --ap-text: #ffffff;
      --ap-muted: rgba(255,255,255,0.75);
      --ap-accent: #ffffff;
      --ap-btn: rgba(255,255,255,0.18);
      --ap-btn-hover: rgba(255,255,255,0.26);
      --ap-shadow: 0 18px 40px rgba(0,0,0,0.25);
      --ap-radius: 26px;
    }

    html,body{ height:100%; }
    body{
      margin:0;
      background: transparent;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      display:flex; align-items:center; justify-content:center;
    }

    .ap-wrap{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; background: var(--ap-bg); }
    .ap-card{
      width:min(920px, 96vw);
      border-radius: var(--ap-radius);
      background: linear-gradient(90deg, var(--ap-grad-a), var(--ap-grad-b));
      box-shadow: var(--ap-shadow);
      position:relative;
      overflow:hidden;
      padding: 22px 22px 18px 22px;
      color: var(--ap-text);
    }

    .ap-row{ display:flex; gap:18px; align-items:center; }
    .ap-cover{
      width:140px; height:140px; border-radius:999px; overflow:hidden; flex:0 0 auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      border: 6px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
    }
    .ap-cover img{ width:100%; height:100%; object-fit:cover; display:block; }

    .ap-meta{ flex:1 1 auto; min-width: 0; }
    .ap-title{
      font-size: 38px; line-height: 1.05; font-weight: 800;
      margin:0; letter-spacing: 0.2px;
      text-shadow: 0 2px 0 rgba(0,0,0,0.15);
      white-space: nowrap; overflow:hidden; text-overflow: ellipsis;
    }
    .ap-sub{
      margin-top: 6px; font-size: 18px; color: var(--ap-muted);
      white-space: nowrap; overflow:hidden; text-overflow: ellipsis;
    }

    .ap-progress{ margin-top: 16px; display:flex; align-items:center; gap:14px; }
    .ap-time{ font-variant-numeric: tabular-nums; color: var(--ap-muted); min-width: 56px; }
    .ap-range{
      -webkit-appearance:none; appearance:none;
      width: 100%; height: 12px; border-radius: 999px;
      background: rgba(255,255,255,0.25);
      outline:none; cursor:pointer;
    }
    .ap-range::-webkit-slider-thumb{
      -webkit-appearance:none; appearance:none;
      width: 28px; height: 28px; border-radius: 999px;
      background: var(--ap-accent);
      border: 6px solid rgba(255,255,255,0.35);
      box-shadow: 0 10px 20px rgba(0,0,0,0.22);
    }

    .ap-controls{ margin-top: 18px; display:flex; justify-content:center; gap:14px; align-items:center; flex-wrap:wrap; }

    /* Увеличили кнопки */
    .ap-btn{
      width:62px; height:62px; border-radius:999px; border:0;
      cursor:pointer; background: rgba(255,255,255,0.16);
      color: var(--ap-text); display:grid; place-items:center;
      user-select:none;
      transition: transform .08s ease, background .12s ease;
    }
    .ap-btn:hover{ background: rgba(255,255,255,0.22); }
    .ap-btn:active{ transform: scale(0.985); }

    .ap-main{
      width:76px; height:76px;
      background: rgba(255,255,255,0.22);
      box-shadow: 0 12px 20px rgba(0,0,0,0.18);
    }

    /* SVG иконки */
    .ap-btn svg{ width:30px; height:30px; }
    .ap-main svg{ width:34px; height:34px; }

    .ap-playlist{
      position:absolute; right:14px; top:14px;
      width: min(360px, 92vw); max-height: 70%;
      overflow:auto;
      background: rgba(20,10,45,0.55);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 18px;
      padding: 10px;
      display:none;
      backdrop-filter: blur(10px);
    }
    .ap-playlist.open{ display:block; }
    .ap-track{
      padding: 10px 10px; border-radius: 14px;
      cursor:pointer; display:flex; justify-content:space-between; gap:10px;
      color: rgba(255,255,255,0.92);
    }
    .ap-track:hover{ background: rgba(255,255,255,0.10); }
    .ap-track.active{ background: rgba(255,255,255,0.16); }
    .ap-track small{ color: rgba(255,255,255,0.7); }

    .ap-badge{
      position:absolute; left:18px; bottom:14px;
      display:flex; gap:10px; opacity:0.9; align-items:center;
      color: rgba(255,255,255,0.85); font-size: 13px;
      max-width: calc(100% - 220px);
      overflow:hidden;
      white-space:nowrap;
      text-overflow: ellipsis;
    }

    /* Volume */
    .ap-vol{
      position:absolute;
      right:18px;
      bottom:14px;
      display:flex;
      gap:10px;
      align-items:center;
      color: rgba(255,255,255,0.85);
      font-size: 13px;
      background: rgba(0,0,0,0.18);
      border: 1px solid rgba(255,255,255,0.14);
      padding: 8px 10px;
      border-radius: 14px;
      backdrop-filter: blur(8px);
    }
    .ap-vol input{ width:110px; }

    /* Eq */
    .ap-eq{
      position:absolute; left: 24px; bottom: 22px;
      display:flex; gap:6px; opacity:0.35;
    }
    .ap-eq span{
      width: 12px; height: 16px; border-radius: 4px;
      background: rgba(255,255,255,0.65);
      transform-origin: bottom;
    }
    .ap-eq.playing span{ animation: apBar 0.9s ease-in-out infinite; }
    .ap-eq.playing span:nth-child(2){ animation-delay: .1s; }
    .ap-eq.playing span:nth-child(3){ animation-delay: .2s; }
    .ap-eq.playing span:nth-child(4){ animation-delay: .05s; }
    .ap-eq.playing span:nth-child(5){ animation-delay: .16s; }
    @keyframes apBar{ 0%,100%{ transform: scaleY(0.55); } 50%{ transform: scaleY(1.55); } }

    @media (max-width: 720px){
      .ap-row{ flex-direction: column; align-items: stretch; }
      .ap-cover{ margin: 0 auto; }
      .ap-title{ font-size: 30px; text-align:center; }
      .ap-sub{ text-align:center; }
    }
  </style>
</head>
<body>
  <div id="app" class="ap-wrap"></div>

  <script>
  (function(){
    const DEFAULTS = {
      lang: "ru",
      coverUrl: "https://images.unsplash.com/photo-1520333789090-1afc82db536a?auto=format&fit=crop&w=600&q=60",
      theme: {
        gradA: "rgba(120,90,255,0.75)",
        gradB: "rgba(200,60,255,0.55)",
        text: "#ffffff",
        accent: "#ffffff"
      },
      source: {
        mode: "githubFolder", // githubFolder | rawList
        github: { owner:"kgbgamelab", repo:"player", branch:"main", path:"files" },
        raw: []
      },
      volume: 0.9
    };

    const T = {
      ru: { playlist:"Плейлист", shuffleOn:"Рандом: ВКЛ", shuffleOff:"Рандом: ВЫКЛ", loading:"Загрузка...", error:"Ошибка загрузки", vol:"Громк." },
      en: { playlist:"Playlist", shuffleOn:"Shuffle: ON", shuffleOff:"Shuffle: OFF", loading:"Loading...", error:"Load error", vol:"Vol" }
    };

    const ICONS = {
      play: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 5v14l11-7z"/></svg>`,
      pause:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>`,
      prev: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 19l-9-7 9-7v14z"/><path d="M22 5v14"/></svg>`,
      next: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 5l9 7-9 7V5z"/><path d="M2 5v14"/></svg>`,
      shuffle:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5"/><path d="M4 20l6-6"/><path d="M4 4l6 6"/><path d="M10 14l4 4"/><path d="M14 10l7-7"/><path d="M16 21h5v-5"/></svg>`,
      list:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>`,
      volume:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5l-6 5H2v4h3l6 5z"/><path d="M19 9a4 4 0 0 1 0 6"/><path d="M21 7a7 7 0 0 1 0 10"/></svg>`
    };

    function deepMerge(a,b){
      if(typeof b !== "object" || b === null) return a;
      for(const k of Object.keys(b)){
        if(b[k] && typeof b[k] === "object" && !Array.isArray(b[k])){
          a[k] = deepMerge(a[k] || {}, b[k]);
        } else {
          a[k] = b[k];
        }
      }
      return a;
    }

    function safeParseConfig(){
      const qs = new URLSearchParams(location.search);
      const c = qs.get("c");
      if(!c) return DEFAULTS;
      try{
        const json = decodeURIComponent(escape(atob(c)));
        return deepMerge(structuredClone(DEFAULTS), JSON.parse(json));
      }catch(e){
        return DEFAULTS;
      }
    }

    function escapeHtml(str){
      return String(str).replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[c]));
    }

    function formatTime(s){
      if (!isFinite(s) || s < 0) return "0:00";
      const m = Math.floor(s/60);
      const r = Math.floor(s%60);
      return m + ":" + String(r).padStart(2,"0");
    }

    const CFG = safeParseConfig();
    const t = T[CFG.lang] || T.en;

    // apply theme
    document.documentElement.style.setProperty("--ap-grad-a", CFG.theme.gradA);
    document.documentElement.style.setProperty("--ap-grad-b", CFG.theme.gradB);
    document.documentElement.style.setProperty("--ap-text", CFG.theme.text);
    document.documentElement.style.setProperty("--ap-accent", CFG.theme.accent);

    const app = document.getElementById("app");
    app.innerHTML = `
      <div class="ap-card" role="group" aria-label="Audio player">
        <div class="ap-playlist" id="apList"></div>

        <div class="ap-row">
          <div class="ap-cover"><img id="apCover" alt="cover"></div>

          <div class="ap-meta">
            <h2 class="ap-title" id="apTitle">—</h2>
            <div class="ap-sub" id="apSub">—</div>

            <div class="ap-progress">
              <div class="ap-time" id="apCur">0:00</div>
              <input class="ap-range" id="apSe
